name: Tag Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: autogen
        run: ./autogen.sh
      - name: configure
        run: ./configure
      - name: make
        run: QSTAT_VERSION=${{ github.ref_name }} make
      - uses: actions/upload-artifact@v6
        with:
          name: linux_amd64
          path: qstat

  build_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: install automake
        run: brew install automake
      - name: autogen
        run: ./autogen.sh
      - name: configure
        run: ./configure
      - name: make
        run: QSTAT_VERSION=${{ github.ref_name }} make
      - uses: actions/upload-artifact@v6
        with:
          name: darwin_amd64
          path: qstat


  build_windows:
    runs-on: 	windows-latest
    env:
      QSTAT_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: nmake
        run: |
          nmake -f Makefile.noauto windows windows_debug
      - uses: actions/upload-artifact@v6
        with:
          name: windows_amd64
          path: qstat.exe
  # TODO(austin) build for mac-os which would cover freebsd
  # https://github.com/vmactions/freebsd-vm
  release:
    runs-on: ubuntu-latest
    permissions:
      # needed to create the GitHub release
      contents: write
    needs:
      -  build_windows
      -  build_linux
      -  build_macos
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: bin
      - name: zip
        run: zip -r release.zip bin/* qstat.cfg contrib.cfg LICENSE.*
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prerelease: false
          tag_name:  "${{ github.ref_name }}"
          files: |
            release.zip
