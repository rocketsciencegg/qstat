name: Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: autogen
        run: ./autogen.sh
      - name: autoreconf force
        run: autoreconf --force
      - name: configure
        run: ./configure
      - name: make check
        run: make check
      - name: make distcheck
        run: make distcheck

  build_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: install automake
        run: brew install automake
      - name: autogen
        run: ./autogen.sh
      - name: autoreconf force
        run: autoreconf --force
      - name: configure
        run: ./configure
      - name: make check
        run: make check

  build_windows:
    runs-on:    windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: nmake debug build
        run: |
          nmake -f Makefile.noauto windows_debug
